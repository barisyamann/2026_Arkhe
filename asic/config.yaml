DESIGN_NAME: soc_top

# -----------------------------------------------------------------------------
# RTL kaynaklari
#
# LibreLane dosya-listesi dosyasini dogrudan kabul etmiyor; yalnizca
# VERILOG_FILES adinda bir liste bekliyor. TEK DOGRULUK KAYNAGI filelist.f'tir;
# asagidaki blok ondan URETILIR:
#
#     make sources     bloku yeniden uret
#     make check       filelist.f ile tutarliligi denetle
#
# Sartname bu donusumu ongoruyor: "Gerekli donusum veya yapilandirma
# islemleri asic/Makefile ya da asic/scripts/ altindaki betiklerle
# yapilmalidir."
# -----------------------------------------------------------------------------

# SystemVerilog paket import'lari modul basliklarinda kullanildigi icin
# Yosys'in varsayilan on-isleyicisi yetersiz kaliyor; slang gerekiyor.
#   (ornek: module uart_stream_peripheral import uart_pkg::*; #(...))
USE_SLANG: true

VERILOG_INCLUDE_DIRS:
  - ../rtl/cv32e40p-master/rtl/include
  - ../rtl/Memory
  - ../rtl/Cevre_Birimleri/files_1

# -----------------------------------------------------------------------------
# Saat
# -----------------------------------------------------------------------------
CLOCK_PORT: clk_i
CLOCK_NET: clk_i
CLOCK_PERIOD: 20.0          # 50 MHz - FPGA ile ayni hedef

# -----------------------------------------------------------------------------
# Kisitlar
# -----------------------------------------------------------------------------
PNR_SDC_FILE: constraints/design.sdc
SIGNOFF_SDC_FILE: constraints/design.sdc

# -----------------------------------------------------------------------------
# SRAM MAKROLARI
#
# Makro : sky130_sram_2kbyte_1rw1r_32x512_8
#         512 kelime x 32 bit = 2 kB, bayt granuler yazma maskesi
#         Port 0 (RW) + Port 1 (R)  -> tasarimin port yapisiyla birebir
#         Fiziksel boyut: 683,1 x 416,54 um  = 0,285 mm2
#
# Kullanim (23 ornekleme):
#     u_soc/u_npu/u_npu_sram   NPU TCM   30 kB  -> 15 makro
#     u_soc/u_iram             I-RAM      8 kB  ->  4 makro
#     u_soc/u_dram             D-RAM      8 kB  ->  4 makro
#
# USE_SRAM_MACRO tanimi RTL'deki kosullu yolu acar; tanimsizken cikarimsal
# dizi kullanilir (FPGA Block RAM cikarimi icin).
#
# Sartname: makro sentezde optimize edilip KALDIRILMAMALI, nihai netlist,
# DEF ve GDSII ciktilarinda bulunmalidir.
# -----------------------------------------------------------------------------
VERILOG_DEFINES:
  - USE_SRAM_MACRO

# Makronun Verilog modeli - lint ve sentez icin KARA KUTU tanimi.
#
# MACROS yapisi fiziksel gorunumleri (gds/lef/lib/spice) ve yerlesimi
# tasir ama Verilog modelini VERMEZ. MACROS'a gecerken bu satiri
# kaldirmistim ve Verilator modulu bulamadi:
#   %Error-MODMISSING: Cannot find file containing module:
#                      'sky130_sram_2kbyte_1rw1r_32x512_8'
#
# Ikisi birlikte gerekiyor: MACROS -> nereye konacak,
#                           EXTRA_VERILOG_MODELS -> arayuzu ne.
EXTRA_VERILOG_MODELS:
  - macros/sky130_sram_2kbyte_1rw1r_32x512_8/verilog/sky130_sram_2kbyte_1rw1r_32x512_8.v


# -----------------------------------------------------------------------------
# MAKRO TANIMLARI VE YERLESIMI
#
# EXTRA_LEFS/EXTRA_GDS makronun GORUNUMLERINI verir ama NEREYE konacagini
# soylemez. Ilk denemede akis PDN adiminda durdu:
#     [PDN-0235] Design has unplaced macros.
#
# MACROS yapisi hem gorunumleri hem her instance'in konumunu tasir.
#
# YERLESIM PLANI  -  4 sutun x 6 satir izgara
#   makro       : 683.1 x 416.5 um
#   kanal       : 200 um  (makrolar arasi yonlendirme icin)
#   kenar payi  : 250 um
#   die         : 3832.4 x 3999.2 um = 15.33 mm2
#   makro doluluk: %42.7
#
# Sira: once 15 TCM makrosu, sonra 4 I-RAM, sonra 4 D-RAM. Ayni bellege
# ait makrolar bitisik kalsin diye satir-oncelikli dizildi; boylece adres
# kod cozucu ve okuma coklayicisi kisa tellerle baglanir.
# -----------------------------------------------------------------------------
MACROS:
  sky130_sram_2kbyte_1rw1r_32x512_8:
    gds:
      - macros/sky130_sram_2kbyte_1rw1r_32x512_8/gds/sky130_sram_2kbyte_1rw1r_32x512_8.gds
    lef:
      - macros/sky130_sram_2kbyte_1rw1r_32x512_8/lef/sky130_sram_2kbyte_1rw1r_32x512_8.lef
    lib:
      # NOT: kose anahtarinin degeri LISTE olmali, tek dize degil:
      #   "Refusing to automatically convert string at ...lib.* to list"
      # "*" tum zamanlama koselerini kapsar. Makronun yalnizca TT modeli
      # oldugu icin uc kosede de ayni dosya okunur (bkz. THIRD_PARTY.md).
      "*":
        - macros/sky130_sram_2kbyte_1rw1r_32x512_8/lib/sky130_sram_2kbyte_1rw1r_32x512_8_TT_1p8V_25C.lib
    spice:
      - macros/sky130_sram_2kbyte_1rw1r_32x512_8/spice/sky130_sram_2kbyte_1rw1r_32x512_8.spice
    instances:
      'u_npu.u_npu_sram.g_sram[0].u_macro':
        location: [250.00, 250.00]
        orientation: N
      'u_npu.u_npu_sram.g_sram[1].u_macro':
        location: [1133.10, 250.00]
        orientation: N
      'u_npu.u_npu_sram.g_sram[2].u_macro':
        location: [2016.20, 250.00]
        orientation: N
