# -----------------------------------------------------------------------------
# Floorplan
#
# DIE_AREA makro izgarasindan HESAPLANDI (yukaridaki yerlesim planina bakin).
# Otomatik boyutlandirma (FP_SIZING: relative) makrolarin sigacagi alani
# garanti etmiyor; acik deger veriyoruz.
# -----------------------------------------------------------------------------
FP_SIZING: absolute
DIE_AREA: [0, 0, 3832.40, 4249.24]

# -----------------------------------------------------------------------------
# MAKRO GUC BAGLANTISI
#
# Ilk kosumda PDN adimi 46 uyari verdi (23 makro x 2 pin):
#     [PDN-0231] u_data_ram.g_sram[0].u_macro is not connected to any
#                power/ground nets.
#     [PDN-0189] Supply pin ...u_macro/vccd1 is not connected to any net.
#
# PDN_CONNECT_MACROS_TO_GRID varsayilan olarak true, ama tek basina
# yetmiyor: OpenROAD makronun HANGI pininin hangi ust seviye aga
# baglanacagini bilmiyor. Esleme acikca verilmelidir.
#
# Bicim:  <ornek_adi_regex> <vdd_agi> <gnd_agi> <vdd_pini> <gnd_pini>
#
#   ust seviye aglar : VPWR / VGND   (DEF SPECIALNETS bolumunden okundu)
#   makro pinleri    : vccd1 / vssd1 (makro LEF'inden)
#
# Bu baglanti olmadan makrolarin fiziksel tasarimda GUCU YOKTUR ve LVS
# gecmez. RTL'de guc pinlerinin bagli olmamasi dogrudur (sabite baglamak
# elektriksel kisa devre olurdu); baglanti tam da burada yapilir.
# -----------------------------------------------------------------------------
PDN_CONNECT_MACROS_TO_GRID: true
PDN_MACRO_CONNECTIONS:
  - ".*u_macro VPWR VGND vccd1 vssd1"

# -----------------------------------------------------------------------------
# MAKRO HALO (kenar bosluk payi)
#
# Ilk kosumda detayli yonlendirme SU HATAYLA durdu:
#     [ERROR DRT-1231] Pin u_data_ram.g_sram[3].u_macro/addr1[7]
#                      does not have access point
#
# Zincir soyle isledi:
#   1. Ana yonlendirme BASARILI bitti - 63 turda 55.347 -> 23 ihlal.
#   2. Anten denetimi 282 ag + 343 pin ihlali buldu.
#   3. Onarim 586 DIYOT ekledi.
#   4. Diyotlar makro kenarina yerlesince o pinin erisim noktasi kapandi.
#
# Varsayilan halo 10 um idi. 25 um'ye cikariliyor: makro kenarinda
# standart hucre ve diyot yerlesemeyecek bir serit birakilir, yonlendirici
# pinlere ulasacak yeri korur.
#
# Alan maliyeti yok: kanallar 200 um, halo her iki yandan 25 um alsa bile
# ortada 150 um kullanilabilir serit kaliyor. Global yonlendirme kullanimi
# zaten %14,4 idi - yer bol.
# -----------------------------------------------------------------------------
FP_MACRO_HORIZONTAL_HALO: 30
FP_MACRO_VERTICAL_HALO: 30
PDN_HORIZONTAL_HALO: 30
PDN_VERTICAL_HALO: 30

# -----------------------------------------------------------------------------
# Sentez
# -----------------------------------------------------------------------------
# SENTEZ STRATEJISI - OLCUMLE SECILDI  (25 Agustos 2026)
#
# 'AREA 0' varsayilandi ve problemimizin TERSI yonde optimize ediyordu:
# alanimiz bol (standart hucre dolulugu %12,7) ama kritik yollarimiz
# MANTIK DERINLIGI baskin (tt'de 92 hucre, ss'te 152 hucrelik 32x32 carpma).
#
# LibreLane'in synthesisexploration akisiyla dokuz strateji olculdu
# (sentez + PnR oncesi STA, ayni SDC ve kisitlarla):
#
#   STRATEJI    nom_tt    nom_ss    hucre
#   AREA 3     +3,9027   -8,3425   106460   <-- SECILEN
#   AREA 1     +1,8766   -9,9979    69023
#   AREA 0     +1,5024   -9,3385    69337   <-- onceki
#   DELAY 0    +0,1556  -14,2930    78204
#   DELAY 1    -1,3889  -15,4865    ~78000
#   AREA 2     -2,6410  -12,7225    69423
#   (DELAY 2/3/4 olculemedi - bkz. asagidaki not)
#
# NEDEN AREA 3
#   Adi yaniltici; kaynak koda bakinca ORFS'in betigi cikiyor:
#       strash / dch / map -B 0.9 / topo / stime -c
#       buffer -c -N {MAX_FANOUT_CONSTRAINT}
#       upsize -c / dnsize -c
#   Yani "alan icin esle, sonra zamanlamayi KAPI BOYUTLANDIRMASIYLA duzelt".
#   Hem daha buyuk hem daha hizli olmasinin sebebi bu. buffer -c -N satiri
#   bizim MAX_FANOUT_CONSTRAINT: 20 degerini sentezde de kullaniyor.
#
#   PnR bedeli olculdu: 8. kosumda AREA 0 PnR oncesi +1,502 verirken PnR
#   sonrasi -1,300'e dustu, yani ~2,8 ns. Ayni bedeli uygularsak AREA 3'un
#   PnR sonrasi ~+1,1 vermesi beklenir - tt kosesinde 50 MHz imzalanabilir
#   tek strateji bu.
#
# RISK: hucre sayisi %53 artiyor (69k -> 106k), toplam yerlesen ornekte
# ~%17. Sikisiklik bizim baglayici kisitimiz. Iki telafi ayni kosumda
# devrede: MAX_TRANSITION 0,75 -> 1,0 (DRV tamponlari azalir) ve makro
# gruplamasi (I-RAM/D-RAM ayak izi yariya indi).
#
# NOT - EKSIK OLCUM: DELAY 2/3/4 sonuclari alinamadi; kesif dizini bir
# otomasyon hatasiyla silindi. DELAY 0 (+0,16) ve DELAY 1 (-1,39) AREA 3'un
# cok gerisinde kaldigi icin DELAY ailesinin one gecmesi beklenmiyor, ama
# bu bir varsayimdir. Vakit kalirsa kesif tekrarlanmali.
SYNTH_STRATEGY: "AREA 3"

# -----------------------------------------------------------------------------
# Lint
#
# Sartname reports/lint/ altinda Verilator lint ciktisi istiyor.
# -----------------------------------------------------------------------------
RUN_LINTER: true
LINTER_RELATIVE_INCLUDES: true

# -----------------------------------------------------------------------------
# PDK
# -----------------------------------------------------------------------------
PDK: sky130A
STD_CELL_LIBRARY: sky130_fd_sc_hd

