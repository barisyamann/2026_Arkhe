        orientation: N
      'u_npu.u_npu_sram.g_sram[4].u_macro':
        location: [250.00, 866.54]
        orientation: N
      'u_npu.u_npu_sram.g_sram[5].u_macro':
        location: [1133.10, 866.54]
        orientation: N
      'u_npu.u_npu_sram.g_sram[6].u_macro':
