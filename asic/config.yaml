# -----------------------------------------------------------------------------
# ANTEN ONARIMI - YALNIZCA ATLAMA TELI  (5. kosumda eklendi)
#
# 3. kosum su hatayla dustu:
#     [ERROR DRT-1231] Pin u_data_ram.g_sram[3].u_macro/addr1[7]
#                      does not have access point
#
# Kok neden: anten onarimi 586 diyot ekledi, biri makro kenarina dusup
# pin erisimini kapatti. 4. kosumda halo 25 um'ye cikarildi; yetmedi.
#
# Bu ayar diyot yerlestirmesini tamamen devreden cikarir. Anten ihlalleri
# metal atlama teliyle giderilir - yeni hucre yerlesmez, yerlesim
# kalabaligi olusmaz, makro pini kapanamaz.
#
# Maliyet yonlendirme kaynagidir. Bizde bol: global yonlendirme kullanimi
# %14,4, overflow 0.
# -----------------------------------------------------------------------------
GRT_ANTENNA_REPAIR_JUMPER_ONLY: true

# -----------------------------------------------------------------------------
# MAKRO ICERIGININ KAYNAGI  (6. kosumda eklendi - 24 Agustos 2026)
#
# 6. kosum 91-klayout-render adiminda dustu:
#     The layout has multiple top cells in Layout.top_cell
#
# KOK NEDEN
#   Magic'in varsayilan 'macro' kipinde makro BOS bir kabuk olarak yaratilir;
#   gercek icerik yazma aninda GDS dosyasindan kopyalanir. Kopyalanirken
#   makronun ALT HUCRE TANIMLARI da GDS'e girer, ama kabuk bos oldugu icin
#   onlara HICBIR HUCRE REFERANS VERMEZ. GDS dilinde referanssiz hucre = ust
#   hucre. Dosyada 13 ust hucre olusur: soc_top + SRAM makrosunun 12 ic
#   hucresi. KLayout'un Layout.top_cell metodu TEK ust hucre bekler ve
#   istisna atar (cikis kodu 1 - bellek yetmezligi degil).
#
# TASARIM SAGLAMDI. Geometri soc_top altinda eksiksizdi: makro 23 kez
# ornekleniyor, sinir kutusu 683,1 x 416,54 um dogru, SRAM hucresi ust hucre
# degil. Fazla 12 tanim ARTIK TANIMDI.
#
# YINE DE DUZELTILDI, cunku:
#   - tek ust hucreli GDS foundry teslimi icin dogru olan
#   - sonraki KLayout adimlari (XOR, DRC) AYNI GDS'i acar ve ayni
#     Layout.top_cell duvarina carpabilirdi. Onlar signoff adimi, atlanamaz.
#
# 'PDK' kipi makro hiyerarsisini gercekten kurar, kabuk kalmaz, GDS tek ust
# hucreli cikar. Daha once denenmisti: render 17 saniyede gecti.
#
# NEDEN BASTAN ACIK DEGILDI
#   Bu kipte Magic butun makro hiyerarsisini bellege alir; RSS 10,4 GB
#   olculdu ve 16 GB'lik gelistirme makinesi takas alanina dusuyordu. Akis
#   31 GB'lik bulut makinesine tasindi (yonlendirme tepe bellegi 5,8 GB) -
#   kisit artik gecerli degil.
#
# NOT: bu ayar yalnizca Magic adimlarini etkiler (StreamOut ve sonrasi).
# Yerlestirme ve yonlendirme sonuclari korunur; akis 89. adimdan devam
# ettirilebilir:
#     make asic_resume
# -----------------------------------------------------------------------------
MAGIC_MACRO_STD_CELL_SOURCE: "PDK"

# -----------------------------------------------------------------------------
# MAGIC DRC KAYNAGI  (6. kosumda eklendi - 24 Agustos 2026)
#
# MAGIC_MACRO_STD_CELL_SOURCE: PDK ayarinin BEKLENMEYEN BEDELI.
#
# PDK kipi makro hiyerarsisini gercekten kurunca Magic DRC artik 23 SRAM
# makrosunun ICINE de iniyor. Eski 'macro' kipinde makro bos kabuktu ve DRC
# iceri hic girmiyordu. Is yuku kat kat artti:
#     99-magic-drc  1 saat 27 dakika kostu, bitmedi
#     bellek 31 GB'lik makinede tukendi, yeni SSH oturumu acilamaz oldu
#
# 'false' DRC'yi GDS yerine DEF uzerinden kosturur. Makrolar DEF'te SOYUT
# (abstract) gorunur, yani DRC BIZIM tasarimimizi denetler, ucuncu taraf
# makronun icini denetlemez.
#
# BU NEDEN KABUL EDILEBILIR
#   1. Makro ic geometrisinin DRC imzasi makro saglayicisina aittir; endustri
#      pratigi de budur. Biz makroyu degistirmiyoruz.
#   2. GDS uzerinden DRC yine kosuluyor - KLayout.DRC adimi bagimsiz olarak
#      nihai GDS'i denetliyor. Iki farkli araç, iki farkli kapsam.
#   3. Makro icini denetlemek zaten 5. kosuma kadarki butun sonuclarin
#      dayanagi degildi; oradaki DRC de soyut makro uzerindendi.
#
# TAM DENETIM ISTENIRSE
#   Bu satiri 'true' yapip 64 GB+ bellekli bir makinede kosmak yeterli.
#   Sonuc farki yalnizca makro ic geometrisidir.
# -----------------------------------------------------------------------------
MAGIC_DRC_USE_GDS: false

# -----------------------------------------------------------------------------
# YONLENDIRME SONRASI ZAMANLAMA ONARIMI  (6. kosum sonrasi - 24 Agustos 2026)
#
# 6. kosumda max_ff kosesinde 8 HOLD ihlali cikti (en kotu -0,0622 ns):
#
#   u_uart2.u_rx.bit_cnt_r[1] -> [2]              -0,0622   UART2 RX sayaci
#   u_uart2.u_rx.state_r[3]   -> [0]              -0,0593   UART2 RX FSM
#   u_npu.ram_wdata_a[12..14] -> NPU SRAM         -0,0470   NPU yazma verisi
#   u_instruction_ram.rdata_hold[17] -> CPU FIFO  -0,0172   I-RAM -> cekirdek
#   u_data_ram.aw_addr_reg[7] -> D-RAM SRAM       -0,0164   D-RAM adres
#
# HOLD IHLALI SETUP'TAN FARKLIDIR: saati yavaslatarak DUZELMEZ. Veri saat
# kenarindan once varir ve yanlis deger yakalanir - her frekansta bozuktur.
# Bu yuzden ss kosesindeki setup sapmasi gibi "belgelenmis sapma" olarak
# birakilamaz.
#
# KOK NEDEN
#   RUN_POST_GRT_RESIZER_TIMING varsayilan olarak FALSE idi. Yani hold
#   onarimi YALNIZCA CTS sonrasi, TAHMINI parazitiklerle kosuldu. Gercek
#   yonlendirme gecikmeleri eklendikten sonra ortaya cikan ihlalleri
#   yakalayacak ikinci gecis hic calismadi.
#
# HICBIRI CEKIRDEGIN KENDI MANTIGINDA DEGIL - hepsi cevre birimi ya da
# bellek arayuzu. Cozum RTL'e dokunmadan, tampon ekleyerek yapilir.
# -----------------------------------------------------------------------------
RUN_POST_GRT_RESIZER_TIMING: true

# Yonlendirme sonrasi hold marji 0,05 -> 0,10 ns.
# En kotu ihlal -0,0622 ns; 0,05'lik marj onu kapatmaya yetmiyordu.
# 0,10 hem mevcut ihlalleri hem de kucuk kosum farklarini kapsar.
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.1

# -----------------------------------------------------------------------------
# BOYUTLANDIRICI KOSELERI
#
# RSZ_CORNERS tanimsizdi. Hold onarimi HIZLI kosede yapilmalidir - ihlaller
# tam da orada (max_ff, -40C / 1,95 V). Yalnizca tipik kosede calisan bir
# onarim ff kosesindeki hold sorununu GORMEZ.
#
# Uc kose veriliyor: hold icin ff, setup icin ss, denge icin tt.
# -----------------------------------------------------------------------------
# DUZELTME (7. kosum baslatildiktan sonra): nom_ss LISTEDEN CIKARILDI.
#
# Ilk yazimda uc kose verilmisti. 7. kosumun yerlestirme sonrasi setup
# onarim dongusunde boyutlandirici ss kosesini kovalamaya basladi:
#     iterasyon 1140 -> 1220 arasinda WNS -5,936 -> -5,802
#     yani 80 iterasyonda 0,13 ns
# ss'teki -6,31 ns'nin kaynagi CV32E40P'nin KENDI ICI ve ucuncu taraf IP'ye
# dokunmama karari geregi kapatilamaz. Boyutlandiriciyi oraya salmak
# saatlerce kosum suresi ve tampon siskinligi demek, kazanc yok.
#
# tt : imza hedefimiz (50 MHz), setup onarimi buraya odaklanmali
# ff : hold ihlalleri BURADA - hold onarimi hizli koseyi gormek zorunda
RSZ_CORNERS:
  - nom_tt_025C_1v80
  - nom_ff_n40C_1v95

# -----------------------------------------------------------------------------
# ZAMANLAMA ODAKLI YERLESTIRME  (Talha'nin 6. kosum incelemesi - §5)
#
# resolved.json'da PL_TIMING_DRIVEN false idi. Yerlestirici hucreleri
# yalnizca tel uzunlugunu gozeterek konumluyordu; kritik yollarin kisalmasi
# icin bir cabasi yoktu. Zamanlama sinirli bir tasarimda bu birakilmis
# kazanctir.
#
# Maliyet: yerlestirme adimi uzar. Kazanc: kritik yollar kisalir, hem setup
# hem DRV (slew/cap) iyilesir.
# -----------------------------------------------------------------------------
PL_TIMING_DRIVEN: true

# -----------------------------------------------------------------------------
# YONLENDIRME SONRASI TASARIM KURALI ONARIMI  (Talha - §5)
#
# RUN_POST_GRT_DESIGN_REPAIR false idi. max cap / max slew onarimi yalnizca
# yerlestirme asamasinda, TAHMINI parazitiklerle yapiliyordu. Gercek
# yonlendirme kapasitesi eklendikten sonra dogan ihlalleri kapatacak gecis
# yoktu - hold'daki RUN_POST_GRT_RESIZER_TIMING sorununun DRV karsiligi.
#
# 6. kosumda dokuz kosenin tamaminda cap/slew ihlali vardi (en iyi kosede
# bile 215/579). SDC'ye eklenen kisitlarla birlikte bu adim da acilmali.
# -----------------------------------------------------------------------------
RUN_POST_GRT_DESIGN_REPAIR: true
